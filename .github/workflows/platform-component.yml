name: Reusable desktop and Android application

on:
  workflow_call:
    inputs:
      platform: {type: string, required: true}
      runner: {type: string, required: true}
    secrets:
      ANDROID_KEYSTORE_BASE64: {required: false}
      ANDROID_STORE_PASSWORD: {required: false}
      ANDROID_KEY_ALIAS: {required: false}
      ANDROID_KEY_PASSWORD: {required: false}
    outputs:
      artifact-name:
        value: ${{ jobs.build.outputs.artifact-name }}
      fingerprint:
        value: ${{ jobs.build.outputs.fingerprint }}

permissions:
  contents: read
  actions: read

jobs:
  build:
    if: inputs.platform != 'android-arm64' || (github.repository == 'caocaocc/keqdroid' && github.ref == 'refs/heads/dev' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch'))
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      PLATFORM: ${{ inputs.platform }}
      ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      # Signing configuration must never be serialized into reusable caches.
      GRADLE_OPTS: -Dorg.gradle.configuration-cache=false
    outputs:
      artifact-name: ${{ steps.identity.outputs.artifact-name }}
      fingerprint: ${{ steps.fingerprint.outputs.fingerprint }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: mkdir -p build/platform-logs build/platform-archives
      - uses: actions/setup-java@v4
        if: inputs.platform == 'android-arm64'
        with:
          distribution: temurin
          java-version: '17'
      - name: Load persistent Android signing identity
        if: inputs.platform == 'android-arm64'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, os, pathlib, subprocess
          for key in ('KEYSTORE_BASE64', 'ANDROID_STORE_PASSWORD', 'ANDROID_KEY_ALIAS', 'ANDROID_KEY_PASSWORD'):
              if not os.environ.get(key):
                  raise SystemExit('Persistent Android signing secrets are required')
          path = pathlib.Path(os.environ['RUNNER_TEMP']) / 'keqdroid-release.jks'
          path.write_bytes(base64.b64decode(os.environ['KEYSTORE_BASE64'], validate=True))
          path.chmod(0o600)
          certificate = subprocess.check_output(['keytool', '-exportcert', '-keystore', str(path),
              '-storepass:env', 'ANDROID_STORE_PASSWORD', '-alias', os.environ['ANDROID_KEY_ALIAS']])
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write(f'ANDROID_KEYSTORE_FILE={path}\n')
              output.write(f'ANDROID_SIGNING_CERT_SHA256={hashlib.sha256(certificate).hexdigest()}\n')
          PY
      - name: Identify exact source, toolchain and signing inputs
        id: fingerprint
        run: python3 tool/ci/checkpoint.py fingerprint --platform "$PLATFORM" --github-output "$GITHUB_OUTPUT"
      - id: identity
        env:
          PREFIX: ${{ steps.fingerprint.outputs.artifact-prefix }}
        run: echo "artifact-name=$PREFIX-attempt${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        id: compiled-cache
        with:
          path: build/platform-archives/${{ inputs.platform }}.tar*
          key: platform-app-${{ inputs.platform }}-${{ steps.fingerprint.outputs.fingerprint }}
      - name: Verify cached application
        id: verify-cache
        if: steps.compiled-cache.outputs.cache-hit == 'true'
        continue-on-error: true
        run: >-
          python3 tool/ci/checkpoint.py restore --platform "$PLATFORM"
          --archive "build/platform-archives/$PLATFORM.tar" --destination "build/platform-components/$PLATFORM"
          2>&1 | tee build/platform-logs/cache.log
      - name: Find verified matching dev artifact
        id: previous
        if: steps.verify-cache.outcome != 'success'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python3 tool/ci/checkpoint.py fetch --platform "$PLATFORM"
          --archive "build/platform-archives/$PLATFORM.tar" --destination "build/platform-components/$PLATFORM"
          --github-output "$GITHUB_OUTPUT" 2>&1 | tee build/platform-logs/fetch.log
      - id: source
        env:
          CACHE: ${{ steps.verify-cache.outcome }}
          ARTIFACT: ${{ steps.previous.outputs.hit }}
        run: |
          if [[ "$CACHE" == success || "$ARTIFACT" == true ]]; then
            echo 'build=false' >> "$GITHUB_OUTPUT"
          else
            echo 'build=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: subosito/flutter-action@v2
        id: flutter-sdk
        if: steps.source.outputs.build == 'true'
        with:
          flutter-version: '3.44.4'
          cache: true
      - name: Restore compilation intermediates
        id: intermediates
        if: steps.source.outputs.build == 'true'
        uses: actions/cache/restore@v4
        with:
          path: |
            .dart_tool/flutter_build
            build/windows
            build/linux
            build/app/intermediates/cxx
            build/app/intermediates/javac
            build/app/intermediates/merged_native_libs
            build/app/intermediates/stripped_native_libs
            build/app/tmp/kotlin-classes
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper
          key: platform-intermediates-${{ inputs.platform }}-${{ steps.fingerprint.outputs.fingerprint }}
          restore-keys: platform-intermediates-${{ inputs.platform }}-
      - name: Install Linux build dependencies
        if: steps.source.outputs.build == 'true' && inputs.platform == 'linux-x64'
        run: >-
          sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config
          libgtk-3-dev liblzma-dev libayatana-appindicator3-dev libsecret-1-dev
      - name: Compile and verify payload
        if: steps.source.outputs.build == 'true'
        env:
          EXPECTED_APP_FINGERPRINT: ${{ steps.fingerprint.outputs.fingerprint }}
        run: >-
          python3 tool/ci/build_platform.py --platform "$PLATFORM" --destination "build/platform-components/$PLATFORM"
          2>&1 | tee build/platform-logs/build.log
      - name: Seal verified application
        if: steps.source.outputs.build == 'true'
        run: >-
          python3 tool/ci/checkpoint.py pack --platform "$PLATFORM" --source "build/platform-components/$PLATFORM"
          --archive "build/platform-archives/$PLATFORM.tar" 2>&1 | tee build/platform-logs/archive.log
      - name: Save successful component immediately
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.identity.outputs.artifact-name }}
          path: build/platform-archives/${{ inputs.platform }}.tar*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - uses: actions/cache/save@v4
        if: steps.compiled-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        with:
          path: build/platform-archives/${{ inputs.platform }}.tar*
          key: ${{ steps.compiled-cache.outputs.cache-primary-key }}
      - name: Save intermediates even on failure
        if: always() && steps.intermediates.outcome == 'success' && steps.intermediates.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            .dart_tool/flutter_build
            build/windows
            build/linux
            build/app/intermediates/cxx
            build/app/intermediates/javac
            build/app/intermediates/merged_native_libs
            build/app/intermediates/stripped_native_libs
            build/app/tmp/kotlin-classes
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper
          key: ${{ steps.intermediates.outputs.cache-primary-key }}
      - name: Preserve downloaded dependencies after failure
        if: failure() && steps.flutter-sdk.outcome == 'success' && steps.flutter-sdk.outputs.PUB-CACHE-HIT != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.flutter-sdk.outputs.PUB-CACHE-PATH }}
          key: ${{ steps.flutter-sdk.outputs.PUB-CACHE-KEY }}-${{ hashFiles('pubspec.lock') }}
      - name: Remove temporary signing material
        if: always() && inputs.platform == 'android-arm64'
        run: rm -f "$RUNNER_TEMP/keqdroid-release.jks"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs-app-${{ inputs.platform }}-attempt${{ github.run_attempt }}
          path: build/platform-logs/
          retention-days: 30
