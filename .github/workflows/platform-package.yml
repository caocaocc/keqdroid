name: Reusable desktop and Android packaging

on:
  workflow_call:
    inputs:
      platform: {type: string, required: true}
      runner: {type: string, required: true}
      app_artifact: {type: string, required: true}
      fingerprint: {type: string, required: true}

permissions:
  contents: read
  actions: read

jobs:
  package:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      PLATFORM: ${{ inputs.platform }}
      APP_FINGERPRINT: ${{ inputs.fingerprint }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: mkdir -p build/platform-logs build/release-archives
      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.app_artifact }}
          path: build/platform-archives
      - name: Restore checked application (no signing key or compiler required)
        run: |
          python3 - <<'PY'
          import os, pathlib, sys
          sys.path.insert(0, 'tool/ci')
          import checkpoint
          platform = os.environ['PLATFORM']
          checkpoint.restore(f'build/platform-archives/{platform}.tar', f'build/platform-components/{platform}',
              'app', platform, os.environ['APP_FINGERPRINT'])
          PY
      - name: Install Linux packaging tools
        if: inputs.platform == 'linux-x64'
        run: >-
          sudo apt-get update && sudo apt-get install -y patchelf rpm squashfs-tools
          libgtk-3-0 libayatana-appindicator3-1
      - name: Package precompiled application
        run: >-
          python3 tool/ci/package_platform.py --platform "$PLATFORM" --source "build/platform-components/$PLATFORM"
          --destination "build/platform-release/$PLATFORM" 2>&1 | tee build/platform-logs/package.log
      - name: Bind verified release payload to this commit
        run: >-
          python3 tool/ci/checkpoint.py seal-release --platform "$PLATFORM" --source "build/platform-release/$PLATFORM"
          --archive "build/release-archives/$PLATFORM.tar"
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ inputs.platform }}-${{ github.sha }}-attempt${{ github.run_attempt }}
          path: build/release-archives/${{ inputs.platform }}.tar*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs-package-${{ inputs.platform }}-attempt${{ github.run_attempt }}
          path: build/platform-logs/
          retention-days: 30
